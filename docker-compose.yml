# docker compose up --build   -> фронт :3000, бэк :8000
# Работает и без .env: без ключа бэкенд поднимается в mock-режиме.
services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
